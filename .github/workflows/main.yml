name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# needed to publish the APK as a GitHub Release (the app's "Check for update" reads it)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Android প্ল্যাটফর্ম ফোল্ডার তৈরি (আমাদের lib/ অক্ষত রেখে)
      - name: Generate Android scaffold
        run: |
          cp -r lib /tmp/fastget_lib
          flutter create --platforms=android --org com.fastget --project-name fastget .
          rm -rf lib && cp -r /tmp/fastget_lib lib
          # remove generated sample test and lint config (they reference the template app)
          rm -rf test analysis_options.yaml

      - name: Patch AndroidManifest, add service and MainActivity
        run: python3 tool/patch_manifest.py

      # Same signing key for every build, so a new APK installs over the old one
      # (update without uninstalling).
      - name: Use the fixed signing key
        run: |
          mkdir -p "$HOME/.android"
          cp tool/debug.keystore "$HOME/.android/debug.keystore"

      # Gradle would otherwise sign with a new random key on every build
      - name: Sign with the fixed key
        run: python3 tool/patch_signing.py

      # works on older phones too (Android 5.0 and up)
      - name: Lower the minimum Android version
        run: python3 tool/patch_minsdk.py

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      # Newer Android Gradle Plugin rejects 'proguard-android.txt' used by some
      # plugin versions; switch those plugin build files to the optimize variant.
      - name: Patch plugin ProGuard setting (AGP compatibility)
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          grep -rl "proguard-android.txt" "$CACHE/hosted" --include=build.gradle --include=build.gradle.kts 2>/dev/null \
            | tee /dev/stderr | xargs -r sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g"

      - name: Analyze (errors fail the build, warnings do not)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # build number = run number, so the app can tell which build is newer
      # 32-bit and 64-bit phones in one APK (so one update file fits everyone);
      # x86 is left out: it is only emulators, and it was a third of the size.
      - name: Build APK
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --target-platform android-arm,android-arm64
          --split-debug-info=build/symbols

      - name: Report APK size and minimum Android
        run: |
          ls -l build/app/outputs/flutter-apk/app-release.apk
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -E "^sdkVersion|^targetSdkVersion|native-code"
          unzip -l build/app/outputs/flutter-apk/app-release.apk | sort -rn | head -12

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk DROM.apk

      # Stop the release if the APK is not signed with the fixed key: such a
      # build could not be installed over the previous one.
      - name: Check the signing key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          WANT=$(keytool -list -v -keystore tool/debug.keystore -storepass android 2>/dev/null | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          GOT=$("$APKSIGNER" verify --print-certs DROM.apk | grep 'certificate SHA-256 digest' | head -1 | sed 's/.*: *//' | tr 'A-F' 'a-f')
          echo "keystore: $WANT"
          echo "apk:      $GOT"
          test -n "$WANT" && test "$WANT" = "$GOT"

      # Small patches (old APK -> new APK) so the app downloads only what changed.
      # A failure here never blocks the release: the app then downloads the full APK.
      - name: Make update patches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install bsdiff4
          python3 tool/make_patches.py DROM.apk ${{ github.run_number }} patches

      - uses: actions/upload-artifact@v4
        with:
          name: DROM-apk
          path: DROM.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release notes = the commit message (what the "What's new" page shows)
          git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.txt
          EXTRA=""
          if [ -f patches/DROM.sha256 ]; then EXTRA="$(ls patches/*)"; fi
          gh release create "build-${{ github.run_number }}" DROM.apk $EXTRA \
            --title "SDM build ${{ github.run_number }}" \
            --notes-file notes.txt \
            --latest
