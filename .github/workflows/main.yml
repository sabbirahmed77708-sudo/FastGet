name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Android প্ল্যাটফর্ম ফোল্ডার তৈরি (আমাদের lib/ অক্ষত রেখে)
      - name: Generate Android scaffold
        run: |
          cp -r lib /tmp/fastget_lib
          flutter create --platforms=android --org com.fastget --project-name fastget .
          rm -rf lib && cp -r /tmp/fastget_lib lib
          # remove generated sample test and lint config (they reference the template app)
          rm -rf test analysis_options.yaml

      - name: Patch AndroidManifest (permissions)
        run: python3 tool/patch_manifest.py

      - run: flutter pub get

      # Newer Android Gradle Plugin rejects 'proguard-android.txt' used by some
      # plugin versions; switch those plugin build files to the optimize variant.
      - name: Patch plugin ProGuard setting (AGP compatibility)
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          grep -rl "proguard-android.txt" "$CACHE/hosted" --include=build.gradle --include=build.gradle.kts 2>/dev/null \
            | tee /dev/stderr | xargs -r sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g"

      - name: Analyze (errors fail the build, warnings do not)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: FastGet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
