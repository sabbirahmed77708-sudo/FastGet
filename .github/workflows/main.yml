name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Android প্ল্যাটফর্ম ফোল্ডার তৈরি (আমাদের lib/ অক্ষত রেখে)
      - name: Generate Android scaffold
        run: |
          cp -r lib /tmp/fastget_lib
          flutter create --platforms=android --org com.fastget --project-name fastget .
          rm -rf lib && cp -r /tmp/fastget_lib lib

      - name: Patch AndroidManifest (permissions)
        run: python3 tool/patch_manifest.py

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: FastGet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
